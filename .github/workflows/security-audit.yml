name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          pip install build
          python -m build --outdir dist

      - name: Resolve the user tree
        run: |
          python -m venv /tmp/user
          /tmp/user/bin/pip install "dist/"*.whl
          /tmp/user/bin/pip freeze > user.txt

      - name: Audit
        id: audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --vulnerability-service osv -r user.txt 2>&1 | tee audit.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open an issue if anything was found
        if: steps.audit.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "pip-audit: advisories found $(date -u +%Y-%m-%d)" \
            --body "$(printf '```\n%s\n```' "$(cat audit.txt)")"
